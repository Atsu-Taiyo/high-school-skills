<title id="f71000c-t">斜面上の物体と重力の分解</title>
<desc id="f71000c-d">左は粗い斜面上で静止する物体に働く重力，垂直抗力，摩擦力。右は同じ重力を斜面に平行な成分と垂直な成分に分解した図。左右の力は同一尺度である。</desc>
